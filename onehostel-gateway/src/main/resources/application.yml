server:
  port: ${SERVER_PORT:9001}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: onehostel-gateway
  profiles:
    # Local development unless SPRING_PROFILES_ACTIVE says otherwise (set it from the deployment, never the image)
    default: local
  config:
    # Secrets come from the environment or the git-ignored .env in the repo root (see .env.example)
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  security:
    oauth2:
      resourceserver:
        jwt:
          # Signature (JWKS), issuer and expiry of every access token are verified
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/onehostel}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/onehostel/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: access-core
              uri: ${ACCESS_CORE_URI:http://localhost:9002}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/access/**
            - id: resident
              uri: ${RESIDENT_URI:http://localhost:9004}
              predicates:
                - Path=/api/v1/resident/**
            - id: property
              uri: ${PROPERTY_URI:http://localhost:9005}
              predicates:
                - Path=/api/v1/property/**
            - id: billing
              uri: ${BILLING_URI:http://localhost:9006}
              predicates:
                - Path=/api/v1/billing/**

app:
  internal:
    # Sent downstream as X-Internal-Secret; every service checks it. Required outside the local profile.
    secret: ${GATEWAY_INTERNAL_SECRET:}
    verify-inbound: false
  gateway:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/otp/send
      - /api/v1/auth/otp/verify
      - /api/v1/auth/forgot-password/reset
      - /api/v1/auth/refresh-token
      - /api/v1/auth/logout
      - /actuator/health/**
      - /actuator/info
    # Any signed-in user, no privilege needed. Every other /api call needs a privilege covering it (PrivilegeFilter).
    authenticated-paths:
      - /api/v1/auth/change-password
      - /api/v1/access/privileges
      - /api/v1/access/me
    # Which privilege covers which API, and each role's privToken (reused for privilege-cache-ttl)
    privilege-matrix-uri: ${ACCESS_CORE_URI:http://localhost:9002}/internal/v1/privileges/matrix
    privilege-cache-ttl: ${PRIVILEGE_CACHE_TTL:60s}
    rate-limit-paths:
      - /api/v1/auth/login
      - /api/v1/auth/otp/**
      - /api/v1/auth/forgot-password/**
      - /api/v1/auth/refresh-token
    rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}] [%X{tenantId:-}]"
