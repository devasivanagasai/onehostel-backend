# Layered on top of "dev" in tests, which run without a MongoDB server:
# nothing may touch the database at startup.
spring:
  data:
    mongodb:
      auto-index-creation: false

app:
  bootstrap:
    # Overrides the dev super admin, so no account is created.
    admin-email: ""
    admin-password: ""
    demo-users: false
    user-migration: false
  rate-limit:
    auth-requests-per-minute: 10000
  gateway:
    # Nothing listens on port 1: routed requests fail fast with 503, never reaching a real service.
    access-core-uri: http://127.0.0.1:1
    seed-public-endpoints: false
