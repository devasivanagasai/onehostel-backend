server:
  port: ${SERVER_PORT:9002}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: onehostel-access-core
  profiles:
    # Local development unless SPRING_PROFILES_ACTIVE says otherwise (set it from the deployment, never the image)
    default: local
  config:
    # Secrets come from the environment or the git-ignored .env in the repo root (see .env.example)
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  data:
    mongodb:
      # Each service owns its database
      uri: ${ACCESS_MONGODB_URI:mongodb://localhost:27017/onehostel_access}
      auto-index-creation: true

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:onehostel}
  # Password logins
  client-id: ${KEYCLOAK_CLIENT_ID:onehostel-backend}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  # OTP login (token exchange) and the admin API
  service-client-id: ${KEYCLOAK_SERVICE_CLIENT_ID:oh-auth-gtwy-service}
  service-client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET:}

app:
  internal:
    # Must equal the gateway's; required outside the local profile
    secret: ${GATEWAY_INTERNAL_SECRET:}
  tenancy:
    mode: ENFORCE

springdoc:
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}] [%X{tenantId:-}]"
