# oh-access-core: business service. Never exposed to browsers; oh-auth-gtwy (port 8080) is the
# only entry point and forwards here with a signed caller identity. Secrets come from environment
# variables (see README.md).
server:
  port: ${ACCESS_CORE_PORT:8082}
  # Listen on loopback only by default, so nothing but the gateway on this machine can reach it.
  address: ${ACCESS_CORE_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: oh-access-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI}
      # This service's own database; the URI only points at the cluster.
      database: ${ACCESS_CORE_DB:onehostel_core}
      auto-index-creation: true

app:
  gateway:
    # Must equal oh-auth-gtwy's app.gateway.signing-secret.
    signing-secret: ${GATEWAY_SIGNING_SECRET}
    max-clock-skew: 60s
  bootstrap:
    demo-organization: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # The correlation id is the one the gateway created, so both services' logs line up.
    level: "%5p [%X{correlationId:-}]"
  level:
    com.onehostel: INFO
