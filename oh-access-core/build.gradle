plugins {
    id 'java-library'
}

dependencies {
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Jackson
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.0'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.0'
    api 'org.springframework:spring-webmvc:6.1.13'

    // Jakarta Validation API
    api 'jakarta.validation:jakarta.validation-api:3.1.0'

    // Spring Web, WebMVC & Context (fixes BindingResult, MethodArgumentNotValidException, and Throwable hierarchy)
    api 'org.springframework:spring-web:6.1.13'
    api 'org.springframework:spring-webmvc:6.1.13'
    api 'org.springframework:spring-context:6.1.13'
    api 'org.springframework:spring-webflux:6.1.13'

    // Spring Data Commons & Spring TX/DAO (for DuplicateKeyException, OptimisticLockingFailureException)
    api 'org.springframework.data:spring-data-commons:3.3.4'
    api 'org.springframework:spring-tx:6.1.13'

    // SLF4J
    api 'org.slf4j:slf4j-api:2.0.16'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    api 'org.springframework.data:spring-data-mongodb:4.3.4'
}

tasks.named('test') {
    useJUnitPlatform()
}